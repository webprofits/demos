<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Thanks - Skein Sisters</title>
  <meta name="description" content="Your message has reached the shop. One of our yarn specialists will reply within a day.">
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { --text: #3d5e69; --text-light: #4f6d77; --text-muted: #6b8089; --bg-alt: #f5eef0; --teal: #3d5e69; --aqua: #badad6; --pink: #efafe8; --apricot: #e0a580; --radius: 1rem; }
    body { line-height: 1.55; }
    h1, h2, h3 { text-transform: uppercase; letter-spacing: -0.02em; font-weight: 500; color: var(--teal); }
    h2 { font-size: clamp(1.6rem, 3vw, 2.3rem); line-height: 1.1; }
    h3 { font-size: 1.15rem; }
    .section--dark h2, .section--dark h3, .section--dark .label { color: #fff; }
    .section--dark .label { color: var(--aqua); }
    .section--dark p { color: rgba(255,255,255,.88); }
    .btn { text-transform: uppercase; letter-spacing: .05em; font-weight: 500; font-size: .9rem; }
    .btn--accent { background: var(--brand); color: #fff; }
    .btn--light { background: #fff; color: var(--brand); }
    .btn--ghost { background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; }
    .btn--outline { background: #fff; border: 1px solid var(--brand); color: var(--brand); }
    .cta-row { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; margin-top: 1.5rem; }
    .cta-note { font-size: .85rem; color: var(--text-muted); margin-top: .75rem; max-width: none; }
    .text-centre { text-align: center; }
    /* nav */
    .nav { padding: .75rem 0; }
    .nav__logo img { height: 42px; }
    .nav .logo-colour { display: none; }
    .nav--scrolled .logo-colour { display: block; }
    .nav--scrolled .logo-white { display: none; }
    .nav .btn { padding: .65rem 1.3rem; font-size: .78rem; }
    /* hero */
    .hero { background: var(--dark); color: #fff; padding: 7.5rem 0 4.5rem; min-height: 100svh; display: flex; align-items: center; overflow: hidden; position: relative; }
    .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(60% 60% at 80% 20%, rgba(143,75,136,.35), transparent 70%); pointer-events: none; }
    .hero__grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 3.5rem; align-items: center; position: relative; }
    .hero__badge { display: inline-block; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: .5rem 1.1rem; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 1.4rem; line-height: 1.4; }
    .hero h1 { color: #fff; font-size: clamp(1.9rem, 3.3vw, 2.75rem); line-height: 1.05; margin-bottom: 1.25rem; }
    .hero__sub { font-size: 1.08rem; color: rgba(255,255,255,.9); max-width: 560px; }
    .hero__sub strong { color: #fff; font-weight: 500; }
    .hero__trust { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; margin-top: 1.6rem; font-size: .84rem; color: rgba(255,255,255,.85); padding: 0; list-style: none; }
    .hero__trust li { display: flex; align-items: center; gap: .4rem; }
    .hero__trust svg { color: var(--aqua); flex: none; }
    .hero__img img { width: 100%; height: auto; border-radius: 1.25rem; box-shadow: 0 24px 60px rgba(0,0,0,.35); display: block; }
    .hero__price { display: inline-flex; align-items: baseline; gap: .5rem; background: var(--brand); color: #fff; border-radius: 999px; padding: .45rem 1.1rem; font-size: .9rem; margin-left: .5rem; vertical-align: middle; }
    .hero__price b { font-size: 1.15rem; font-weight: 500; }
    /* v1: the photo bleeds into a background sampled from its own backdrop */
    .hero--bleed { background: linear-gradient(90deg, #2a4e59 0%, #2c5361 40%, #3a6977 70%, #4a8090 100%); }
    .hero--bleed::before { display: none; }
    .hero--bleed .hero__grid { grid-template-columns: minmax(0, 620px) 1fr; position: static; }
    .hero--bleed .hero__grid > div:first-child { position: relative; z-index: 1; max-width: 600px; }
    .hero__img--bleed { position: absolute; top: 0; right: 0; bottom: 0; width: 60%; }
    .hero__img--bleed img { width: 100%; height: 100%; object-fit: cover; object-position: right center; border-radius: 0; box-shadow: none; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 42%); mask-image: linear-gradient(to right, transparent 0, #000 42%); }
    /* stats strip */
    .stats { background: var(--brand); color: #fff; padding: 1.6rem 0; }
    .stats__row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; text-align: center; }
    .stats__n { font-size: 1.55rem; font-weight: 500; line-height: 1.1; }
    .stats__l { font-size: .8rem; opacity: .9; letter-spacing: .05em; text-transform: uppercase; margin-top: .25rem; }
    /* icon cards */
    .icon { width: 50px; height: 50px; border-radius: 50%; background: var(--bg-alt); display: flex; align-items: center; justify-content: center; color: var(--brand); margin-bottom: 1rem; }
    .card p { font-size: .97rem; color: var(--text-light); }
    .cards-6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    /* pain list */
    .pains { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
    .pains li { display: flex; gap: .8rem; align-items: flex-start; background: #fff; border-radius: var(--radius); padding: 1.1rem 1.25rem; border: 1px solid #eadfe3; font-size: .98rem; }
    .pains svg { color: var(--accent); flex: none; margin-top: .15rem; }
    /* mechanism */
    .mech { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5rem; align-items: center; }
    .mech__img img { width: 100%; border-radius: 1.25rem; display: block; }
    .mech__points { display: grid; gap: 1rem; margin-top: 1.5rem; }
    .point { display: flex; gap: 1rem; align-items: flex-start; background: #fff; border-radius: var(--radius); padding: 1rem 1.2rem; border: 1px solid #eadfe3; }
    .point .icon { width: 40px; height: 40px; margin: 0; flex: none; }
    .point b { display: block; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; font-size: .85rem; color: var(--brand); }
    .point span { font-size: .95rem; color: var(--text-light); }
    /* swatches */
    .filters { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin-bottom: 2rem; }
    .filter { border: 1px solid var(--brand); color: var(--brand); background: #fff; border-radius: 999px; padding: .5rem 1.1rem; font: inherit; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; transition: background .2s, color .2s; }
    .filter.active, .filter:hover { background: var(--brand); color: #fff; }
    .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
    .swatch { display: block; text-decoration: none; color: var(--teal); text-align: center; border-radius: var(--radius); overflow: hidden; background: #fff; border: 1px solid #eadfe3; transition: transform .25s, box-shadow .25s; }
    .swatch img { width: 100%; aspect-ratio: 1; display: block; }
    .swatch span { display: block; padding: .6rem .4rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
    .swatch:hover { transform: translateY(-4px); box-shadow: 0 14px 30px rgba(61,94,105,.15); }
    .swatch.hidden { display: none; }
    .swatch { position: relative; }
    .tag { position: absolute; top: .5rem; left: .5rem; font-style: normal; font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; background: rgba(255,255,255,.92); color: var(--brand); border-radius: 999px; padding: .2rem .55rem; }
    .tag--stock { background: var(--brand); color: #fff; }
    .swatch-note { text-align: center; margin: 2rem auto 0; max-width: 680px; font-size: .95rem; color: var(--text-light); }
    /* proof: each photo bleeds into a panel coloured from its own backdrop; copy 61.8%, photo 38.2% */
    .pf { position: relative; display: grid; grid-template-columns: 61.8fr 38.2fr; align-items: center; border-radius: 1.618rem; overflow: hidden; color: #fff; padding: 2.618rem; min-height: 480px; margin-top: 1.618rem; }
    .pf--shape { background: #7e2640; }
    .pf--colour { background: #71445b; }
    .pf--dto { background: #5f5646; }
    .facts.facts--steps { grid-template-columns: repeat(3, 1fr); }
    .facts--steps dt { color: #fff; }
    .facts--steps dt b { display: inline-block; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: #fff; color: #5f5646; text-align: center; line-height: 1.6rem; font-size: .8rem; margin-right: .45rem; }
    .steps p { font-size: .97rem; color: var(--text-light); }
    .pf__img { position: absolute; top: 0; right: 0; bottom: 0; width: 48%; }
    .pf__img img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 42%), linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent 0, #000 42%), linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%); mask-composite: intersect; }
    .pf__body { position: relative; z-index: 1; grid-column: 1; }
    .pf__eyebrow { display: inline-block; font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 999px; padding: .3rem .85rem; margin-bottom: 1rem; }
    .pf__body h3 { font-size: 1.618rem; line-height: 1.1; margin-bottom: 1.618rem; color: #fff; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem 1.618rem; margin: 0; }
    .facts > div { border-left: 2px solid rgba(255,255,255,.45); padding-left: 1rem; }
    .facts dt { font-size: 1.02rem; font-weight: 500; color: #fff; text-transform: uppercase; letter-spacing: .02em; line-height: 1.2; margin-bottom: .3rem; }
    .facts dd { margin: 0; font-size: .92rem; color: rgba(255,255,255,.85); line-height: 1.45; }
    .proof-quote { margin: 1.618rem 0 0; background: rgba(255,255,255,.12); border-radius: 1rem; padding: 1rem 1.25rem; font-size: 1.05rem; color: #fff; max-width: none; }
    .proof-quote cite { display: block; font-style: normal; font-size: .72rem; color: rgba(255,255,255,.7); margin-top: .35rem; letter-spacing: .04em; text-transform: uppercase; }
    /* testimonial slider */
    .tslider { position: relative; margin-top: 1rem; }
    .tslider__track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; gap: 1rem; }
    .tslider__track::-webkit-scrollbar { display: none; }
    .tslide { flex: 0 0 100%; scroll-snap-align: start; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 1.25rem; }
    .tcard { background: #fff; border: 1px solid #eadfe3; border-radius: var(--radius); padding: 1.5rem; display: flex; flex-direction: column; }
    .tcard blockquote { font-size: .97rem; color: var(--teal); margin: .6rem 0 1rem; max-width: none; flex: 1; }
    .tcard cite { font-style: normal; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--brand); display: flex; flex-direction: column; gap: .15rem; }
    .tcard cite span { color: var(--text-muted); text-transform: none; letter-spacing: 0; font-size: .78rem; }
    .tslider__btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--brand); background: #fff; color: var(--brand); font-size: 1.6rem; line-height: 1; cursor: pointer; z-index: 2; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(61,94,105,.12); }
    .tslider__btn--prev { left: -22px; } .tslider__btn--next { right: -22px; }
    .tslider__btn:hover { background: var(--brand); color: #fff; }
    .tslider__dots { display: flex; justify-content: center; gap: .5rem; margin-top: 1.25rem; }
    .tslider__dots button { width: 10px; height: 10px; border-radius: 50%; border: 0; background: #cfd8db; cursor: pointer; padding: 0; }
    .tslider__dots button.active { background: var(--brand); }
    .tslider__count { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
    /* reviews */
    .reviews { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .review { background: #fff; border-radius: var(--radius); padding: 1.75rem; border: 1px solid #eadfe3; }
    .stars { color: #639697; letter-spacing: 2px; font-size: 1rem; }
    .review blockquote { font-size: 1.02rem; margin: .75rem 0 1rem; color: var(--teal); max-width: none; }
    .review cite { font-style: normal; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--brand); }
    .proof-row { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem 2rem; margin-top: 2.5rem; font-size: .9rem; color: var(--text-light); }
    .proof-row b { color: var(--brand); font-weight: 500; }
    .footnote { text-align: center; max-width: none; font-size: .78rem; color: var(--text-muted); margin-top: 1.25rem; }
    /* projects */
    .projects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .project { border-radius: var(--radius); overflow: hidden; background: #fff; border: 1px solid #eadfe3; }
    .project img { width: 100%; aspect-ratio: 4 / 5; display: block; }
    .project div { padding: 1rem 1.2rem 1.25rem; }
    .project b { display: block; text-transform: uppercase; letter-spacing: .05em; font-weight: 500; font-size: .85rem; color: var(--brand); margin-bottom: .3rem; }
    .project span { font-size: .92rem; color: var(--text-light); }
    /* steps */
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; }
    .step__n { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; margin-bottom: 1rem; }
    .step p { font-size: .97rem; color: var(--text-light); }
    /* admission */
    .admit { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5rem; align-items: center; }
    .admit__compare { background: #fff; border-radius: 1.25rem; border: 1px solid #eadfe3; overflow: hidden; }
    .admit__compare div { padding: 1.25rem 1.5rem; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; border-bottom: 1px solid #eadfe3; }
    .admit__compare div:last-child { border-bottom: 0; background: var(--bg-alt); }
    .admit__compare small { color: var(--text-muted); font-size: .85rem; }
    .admit__compare b { font-size: 1.6rem; font-weight: 500; color: var(--teal); white-space: nowrap; }
    .admit__compare div:last-child b { color: var(--brand); }
    .ticks { list-style: none; padding: 0; margin: 1.25rem 0; display: grid; gap: .6rem; }
    .ticks li { display: flex; gap: .6rem; align-items: flex-start; font-size: .97rem; }
    .ticks svg { color: var(--brand); flex: none; margin-top: .3rem; }
    /* guarantee */
    .guarantee { display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: center; background: #fff; border-radius: 1.25rem; padding: 2.5rem; border: 2px solid var(--aqua); }
    .guarantee .icon { width: 84px; height: 84px; margin: 0; }
    .guarantee .icon svg { width: 40px; height: 40px; }
    /* faq */
    .faq__item { border-bottom: 1px solid #e3dcdc; }
    .faq__q { width: 100%; background: none; border: 0; text-align: left; padding: 1.15rem 2.5rem 1.15rem 0; font: inherit; font-size: 1.05rem; font-weight: 500; color: var(--teal); cursor: pointer; position: relative; }
    .faq__q::after { content: "+"; position: absolute; right: 0; top: 50%; transform: translateY(-50%); font-size: 1.6rem; color: var(--brand); font-weight: 400; }
    .faq__item.open .faq__q::after { content: "\2212"; }
    .faq__a { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
    .faq__a p { padding: 0 0 1.2rem; color: var(--text-light); max-width: none; }
    /* picker */
    .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 3.5rem; align-items: center; }
    .picker__card { background: #fff; color: var(--teal); border-radius: 1.25rem; padding: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
    .picker__card h3 { margin-bottom: .35rem; color: var(--teal); }
    .picker__card > p { color: var(--text-light); font-size: .95rem; margin-bottom: 1.25rem; }
    .lead-form label { display: block; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; margin-bottom: .4rem; color: var(--brand); }
    .lead-form select { width: 100%; padding: .85rem 1rem; border: 1px solid #cfd8db; border-radius: 12px; font: inherit; color: var(--teal); background: #f6f7f8; margin-bottom: 1rem; }
    .pick-row { display: flex; gap: .75rem; margin-bottom: 1.25rem; }
    .pick-opt { flex: 1; border: 1px solid #cfd8db; border-radius: 12px; padding: .8rem; cursor: pointer; text-align: center; font-size: .88rem; text-transform: none; letter-spacing: 0; color: var(--teal); margin: 0; display: flex; gap: .5rem; align-items: center; justify-content: center; }
    .pick-opt:has(input:checked) { border-color: var(--brand); background: var(--bg-alt); }
    .pick-opt input { accent-color: var(--brand); margin: 0; }
    .lead-form .btn { width: 100%; justify-content: center; }
    .lead-form .btn + .btn { margin-top: .6rem; }
    .form__privacy { font-size: .8rem; color: var(--text-muted); margin-top: 1rem; max-width: none; text-align: center; }
    .picker__copy .ticks li { color: rgba(255,255,255,.9); }
    .picker__copy .ticks svg { color: var(--aqua); }
    /* sticky bar */
    .sticky { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e3dcdc; padding: .6rem 1rem; display: none; z-index: 90; align-items: center; justify-content: space-between; gap: 1rem; box-shadow: 0 -6px 20px rgba(0,0,0,.08); }
    .sticky span { font-size: .8rem; color: var(--teal); text-transform: uppercase; letter-spacing: .05em; line-height: 1.2; }
    .sticky .btn { width: auto; padding: .65rem 1.2rem; font-size: .78rem; }
    /* footer */
    .footer { padding: 2.5rem 0; background: var(--bg-alt); text-align: center; font-size: .85rem; color: var(--text-light); }
    .footer p { max-width: none; margin-top: 1rem; }
    .footer a { color: var(--brand); }
    .scroll-hint { display: none; text-align: center; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); padding: .75rem 0 0; }
    @media (max-width: 900px) {
      .hero { padding: 6.5rem 0 3.5rem; min-height: 0; }
      .hero__grid, .mech, .admit, .picker { grid-template-columns: 1fr; gap: 2.25rem; }
      .hero__img { order: -1; }
      .hero--bleed { padding-top: 0; background: #2c5361; }
      .hero--bleed .hero__grid { grid-template-columns: 1fr; gap: 0; }
      .hero__img--bleed { position: static; width: calc(100% + 2.5rem); margin: 0 -1.25rem 1.5rem; height: 52vh; }
      .hero__img--bleed img { border-radius: 0; -webkit-mask-image: linear-gradient(to bottom, #000 60%, transparent 100%); mask-image: linear-gradient(to bottom, #000 60%, transparent 100%); }
      .cards-6, .projects, .steps { grid-template-columns: 1fr 1fr; }
      .reviews, .pains { grid-template-columns: 1fr; }
      .pf { display: block; padding: 0 0 1.618rem; min-height: 0; }
      .pf__img { position: static; width: 100%; height: 44vh; margin-bottom: 1.25rem; }
      .pf__img img { -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%); mask-image: linear-gradient(to bottom, #000 55%, transparent 100%); }
      .pf__body { padding: 0 1.25rem; }
      .tslide { grid-template-columns: 1fr 1fr; }
      .tslider__btn--prev { left: -10px; } .tslider__btn--next { right: -10px; }
      .stats__row { grid-template-columns: repeat(2, 1fr); }
      .guarantee { grid-template-columns: 1fr; text-align: center; justify-items: center; }
    }
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.7rem; }
      .hero__img img { max-height: 38vh; object-fit: cover; border-radius: .9rem; }
      .hero__img--bleed { height: 46vh; }
      .hero__img--bleed img { max-height: none; height: 100%; }
      .hero__sub { font-size: .95rem; }
      .hero__price { margin: .5rem 0 0; }
      .cards-6, .projects, .steps { grid-template-columns: 1fr; }
      .swatches { grid-template-columns: repeat(3, 1fr); gap: .6rem; }
      .swatch span { font-size: .65rem; padding: .45rem .2rem; }
      .stats__n { font-size: 1.25rem; }
      .sticky { display: flex; }
      body { padding-bottom: 64px; }
      .nav .btn { width: auto; font-size: .7rem; padding: .55rem 1rem; }
      .admit__compare b { font-size: 1.25rem; }
      .picker__card { padding: 1.5rem; }
      .scroll-hint { display: block; }
      .icon { width: 40px; height: 40px; }
      .tslide { display: contents; }
      .tcard { flex: 0 0 86%; scroll-snap-align: center; }
      .tslider__btn { display: none; }
      .facts, .facts.facts--steps { grid-template-columns: 1fr; }
      .pf__img { height: 40vh; }
    }
  </style>
</head>
<body>
  <header class="nav nav--scrolled">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo"><img class="logo-colour" src="images/logo-aqua-plum.png" alt="Skein Sisters"></a>
      <a href="https://www.skeinsisters.com.au/" class="btn btn--accent">Back to Skein Sisters</a>
    </div>
  </header>
  <section class="section--dark" style="min-height:100vh;display:flex;align-items:center;">
    <div class="container--narrow" style="text-align:center;">
      <span class="label">You're on the list</span>
      <h1 style="color:#fff;">Thanks, we'll be in touch</h1>
