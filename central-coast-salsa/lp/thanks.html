<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Question Received | Central Coast Salsa</title>
  <meta name="description" content="Thanks - your question is with the Central Coast Salsa team. We'll come back to you by email or phone.">
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; }
    .nav { background: #000; padding: .5rem 0; }
    .nav__logo img { height: 52px; width: 52px; display: block; }
    .btn { border-radius: 0; border: 2px solid #fff; background: #fff; color: #000; font-weight: 500; }
    .btn--ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.75); }
    .nav .btn { padding: .6rem 1.2rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; width: auto; }
    .thanks { position: relative; min-height: 100vh; min-height: 100svh; display: flex; align-items: center; overflow: hidden; background: #0e0e0e; color: #fff; text-align: center; }
    .thanks__bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .2; }
    .thanks .container--narrow { position: relative; z-index: 2; }
    .thanks .label { color: #A8A6A1; letter-spacing: .12em; }
    .thanks h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); }
    .thanks p { margin: 0 auto 1.5rem; color: rgba(255,255,255,.88); }
    .thanks ul { list-style: none; padding: 0; margin: 0 auto 2rem; max-width: 520px; text-align: left; }
    .thanks li { padding: .6rem 0 .6rem 2rem; position: relative; border-bottom: 1px solid rgba(255,255,255,.15); }
    .thanks li::before { content: ""; position: absolute; left: .2rem; top: 1.05rem; width: 12px; height: 7px; border-left: 2px solid #A8A6A1; border-bottom: 2px solid #A8A6A1; transform: rotate(-45deg); }
    .btn-row { display: flex; flex-wrap: wrap; gap: .9rem; justify-content: center; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo"><img src="images/logo-dark.png" alt="Central Coast Salsa" width="52" height="52"></a>
      <a href="index.html" class="btn">Back to beginner classes</a>
    </div>
  </header>
  <section class="thanks">
    <img class="thanks__bg" src="images/hero.jpg" alt="Krin Bajough dancing salsa with a student at a Central Coast Salsa social night">
    <div class="container--narrow">
      <span class="label">Question received</span>
      <h1>Thanks - your question is with our team</h1>
      <p>We'll come back to you by email or phone.</p>
      <ul>
        <li>Book your spot now if you're ready - it takes 60 seconds.</li>
        <li>Have a look at the class nights and pick your two.</li>
      </ul>
      <div class="btn-row">
        <a href="https://momence.com/m/484494" class="btn">Book my spot - $45 a week</a>
        <a href="index.html#times" class="btn btn--ghost">See the class nights</a>
      </div>
    </div>
  </section>
</body>
</html>
